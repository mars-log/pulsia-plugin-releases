name: Update plugin catalog

on:
  release:
    types: [published, released, edited, deleted]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-plugin-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-plugin-catalog.mjs
      - name: Verify generator
        run: node --test test/generate-plugin-catalog.test.mjs
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- pulsia-plugin-catalog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulsia-plugin-catalog.json
          git commit -m "chore: update plugin catalog"
          git push
