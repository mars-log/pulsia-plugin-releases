name: Update plugin catalog

on:
  release:
    types: [published, released, edited, deleted]
  push:
    branches: [main]
    paths: ['patches/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-plugin-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-plugin-catalog.mjs
      - name: Verify generator
        run: |
          node --test test/*.test.mjs
          python test/zip-changelog-test.py
      - name: Commit changed catalog
        run: |
          git add -- pulsia-plugin-catalog.json pulsia-plugin-updates.json details/ history/
          if [ -d changelogs ]; then git add -- changelogs/; fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update plugin catalog"
          git push origin main
